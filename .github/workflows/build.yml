name: Build Ding

on:
  push:
    branches-ignore: [build]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ding
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get the code
        run: git clone --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" src

      - name: Use the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcode-select -p

      - name: Build, test and package
        run: |
          cd src
          bash ci/build-dmg.sh 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"

      - name: Publish results to the build branch
        if: always()
        run: |
          cd src
          mkdir -p out
          cp build.log out/ 2>/dev/null || echo "No build log" > out/build.log
          [ -f out/status.txt ] || echo "failure" > out/status.txt
          echo "$GITHUB_SHA" >> out/status.txt
          cd out
          git init -q
          git checkout -q -b build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build
